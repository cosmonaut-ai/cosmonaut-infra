name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.16.5
  AWS_REGION: us-east-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan (${{ matrix.env }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            tfvars_variable: TF_VARS_DEV
          - env: prod
            tfvars_variable: TF_VARS_PROD
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ matrix.env }}-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write CI variables
        env:
          TF_VARS: ${{ vars[matrix.tfvars_variable] }}
        run: printf '%s\n' "$TF_VARS" > ci.auto.tfvars

      - name: Check formatting
        if: matrix.env == 'dev'
        run: terraform fmt -check -recursive ../..

      - run: terraform init

      - run: terraform validate

      - name: Plan
        id: plan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          exit_code=$?
          cat plan.txt
          [ "$exit_code" -ne 1 ]

      - name: Comment plan on pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          ENV_NAME: ${{ matrix.env }}
          PLAN_PATH: envs/${{ matrix.env }}/plan.txt
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const maxPlanChars = 60000;
            const envName = process.env.ENV_NAME;
            const marker = `<!-- terraform-plan-${envName} -->`;
            const fullPlan = fs.existsSync(process.env.PLAN_PATH)
              ? fs.readFileSync(process.env.PLAN_PATH, 'utf8')
              : 'Plan output not available.';
            const plan = fullPlan.length > maxPlanChars ? fullPlan.slice(-maxPlanChars) : fullPlan;
            const summaryLine = fullPlan.match(/^(Plan: .*|No changes\..*)$/m)?.[0] ?? 'See the workflow log.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Terraform plan: \`${envName}\` (${process.env.PLAN_OUTCOME})`,
              summaryLine,
              '',
              `<details><summary>Full plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`,
              '',
              `[Workflow run](${runUrl})`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: Apply (${{ matrix.env }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    concurrency:
      group: terraform-apply-${{ matrix.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - env: dev
            tfvars_variable: TF_VARS_DEV
          - env: prod
            tfvars_variable: TF_VARS_PROD
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-${{ matrix.env }}-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write CI variables
        env:
          TF_VARS: ${{ vars[matrix.tfvars_variable] }}
        run: printf '%s\n' "$TF_VARS" > ci.auto.tfvars

      - run: terraform init

      - name: Plan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -no-color -out=tfplan

      - name: Apply
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -no-color tfplan
